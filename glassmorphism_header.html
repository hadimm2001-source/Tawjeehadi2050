<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميم هيدر زجاجي عصري 2026</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        /* Custom aurora background simulation for testing */
        .bg-aurora {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(20, 184, 166, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }
    </style>
</head>
<body class="bg-aurora min-h-screen text-slate-100 flex flex-col justify-start p-4 sm:p-8">

    <div class="max-w-7xl mx-auto w-full">
        <!-- HEADER SECTION with Glassmorphism -->
        <header class="relative overflow-hidden rounded-2xl backdrop-blur-xl bg-slate-900/75 border border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] transition-all duration-300">
            <!-- Animated 2026 top lightbar gradient -->
            <div class="h-[3px] w-full bg-gradient-to-r from-teal-400 via-cyan-400 to-indigo-500 shadow-[0_1px_15px_rgba(20,184,166,0.5)]" />
            
            <!-- Top Section -->
            <div class="px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-white/5">
                <div class="flex items-center gap-3.5">
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-teal-500 to-cyan-500 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200" />
                        <div class="relative bg-slate-950 border border-teal-500/20 p-2.5 rounded-lg shadow-inner">
                            <!-- Glowing Book Icon SVG -->
                            <svg class="w-6 h-6 text-cyan-400 filter drop-shadow-[0_0_8px_rgba(34,211,238,0.4)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-2xl font-black tracking-tight bg-gradient-to-r from-teal-100 via-white to-cyan-200 bg-clip-text text-transparent">
                            لوحة برامج وخدمات التوجيه الطلابي
                        </h1>
                        <p class="text-teal-400/85 text-xs sm:text-sm font-semibold mt-0.5">مدرسة الجشة المتوسطة</p>
                    </div>
                </div>
                
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                    <!-- User Info Pill with active indicator -->
                    <div class="text-xs sm:text-sm bg-teal-500/10 backdrop-blur-md border border-teal-500/30 shadow-[0_0_15px_rgba(20,184,166,0.15)] flex items-center gap-2.5 px-4 py-2 rounded-full text-teal-200 font-bold">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span>الموجه الطلابي: عبدالهادي بن محمد المحسن</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Section (Action Bar) -->
            <div class="bg-white/[0.02] backdrop-blur-md px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col lg:flex-row justify-between items-center gap-4">
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full lg:w-auto">
                    <label for="program-select" className="text-teal-300 text-xs font-black tracking-wider whitespace-nowrap uppercase">اختر البرنامج والخدمات:</label>
                    <div class="relative w-full sm:w-80">
                        <select
                            id="program-select"
                            class="bg-slate-950/90 border border-teal-500/30 text-white text-xs sm:text-sm rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5 px-3.5 outline-none cursor-pointer shadow-lg backdrop-blur-md transition-all duration-300 font-bold text-right"
                        >
                            <option value="prog_intro_week">الأسبوع التمهيدي</option>
                            <option value="prog_other_1">برنامج التوجيه المهني</option>
                            <option value="prog_other_2">برنامج رعاية المتفوقين</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto justify-end">
                    <!-- Action Button 1 (Active glass effect) -->
                    <button class="bg-teal-500/10 hover:bg-teal-500/20 text-teal-200 border border-teal-500/30 hover:border-teal-500/50 shadow-lg backdrop-blur-md px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all duration-300 cursor-pointer">
                        تقارير البرامج والخدمات
                    </button>
                    <!-- Action Button 2 (Inactive styled glass effect) -->
                    <button class="bg-sky-500/5 hover:bg-sky-500/15 text-sky-200/80 border border-sky-500/20 hover:border-sky-500/40 shadow-lg backdrop-blur-md px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all duration-300 cursor-pointer">
                        خطة دراسة حالة
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Showcase description -->
        <div class="mt-12 text-center text-slate-400 text-xs sm:text-sm">
            <p>تم إعداد هذا الملف بشكل مستقل بناءً على تصميم الهيدر الزجاجي الفاخر (Glassmorphic) لعام 2026 لخدمة برامج التوجيه الطلابي.</p>
        </div>
    </div>

</body>
</html>
